[package]
name = "almanac-setup"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "Almanac Notch Setup.exe: our installer window over Tauri's silent NSIS installer (stage 8g)"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# custom-protocol: the page is embedded (this crate is built with cargo, not the tauri CLI)
tauri = { version = "2.12", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

[profile.release.build-override]
strip = false
