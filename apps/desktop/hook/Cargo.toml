[package]
name = "almanac-hook"
version = "0.2.1"
edition = "2021"
rust-version = "1.90"
publish = false
description = "Claude Code hook client for Almanac Notch and the installer of its hooks"

[lib]
name = "almanac_hook"
path = "src/lib.rs"

[[bin]]
name = "almanac-hook"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
