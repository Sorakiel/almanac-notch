# Release (stage 8f): a tag v* builds the Mac .dmg (one universal build for Apple silicon and
# Intel) and the Windows Setup.exe, plus the update files (latest.json, signed archives), and puts
# them in a draft GitHub release. Publish the draft by hand: only then do installed apps see it.
#
# Repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD - updater key (README, "Релиз")
#   ALMANAC_URL, ALMANAC_KEY - Almanac project address and public key (optional)
#   MAC_CERT_P12 (base64), MAC_CERT_PASSWORD - the self-signed "Almanac Notch" code signing
#     certificate (~/.tauri/almanac-notch-sign.*); without them the Mac build is ad-hoc signed
# Apple signing and notarization are off (owner, 2026-10-18); to turn them on add APPLE_CERTIFICATE,
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID to
# the secrets and to the env below.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ''
            targets: ''
    runs-on: ${{ matrix.os }}
    env:
      # secrets can't be read in `if:`; this flag can
      HAS_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
            apps/desktop/hook -> target
            apps/desktop/setup -> target

      - run: npm ci

      # Mac: the self-signed "Almanac Notch" certificate, trusted on this throwaway runner only,
      # so every release has the same signature (keychain and calendar permissions survive updates)
      - name: Signing certificate
        if: runner.os == 'macOS' && env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$CERT" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings -t 3600 build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          openssl pkcs12 -in cert.p12 -passin env:CERT_PASSWORD -nokeys -legacy -out cert.pem 2>/dev/null || openssl pkcs12 -in cert.p12 -passin env:CERT_PASSWORD -nokeys -out cert.pem
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain cert.pem
          rm cert.p12 cert.pem
          security find-identity -v -p codesigning
          echo "APPLE_SIGNING_IDENTITY=Almanac Notch" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ALMANAC_URL: ${{ secrets.ALMANAC_URL }}
          ALMANAC_KEY: ${{ secrets.ALMANAC_KEY }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Almanac Notch ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          releaseBody: |
            **Mac** - `Almanac_Notch_*_universal.dmg`: открыть, перетащить в «Программы». Приложение пока без подписи Apple: при первом запуске macOS скажет, что не может проверить разработчика. Откройте «Системные настройки → Конфиденциальность и безопасность» и нажмите «Всё равно открыть» (один раз).

            **Windows** - `Almanac.Notch.Setup.exe`: папку можно выбрать, прав администратора не нужно. Подписи пока нет: SmartScreen спросит - «Подробнее» → «Выполнить в любом случае». Файл `*_x64-setup.exe` нужен приложению для обновлений, скачивать его не надо.

            Дальше приложение обновляется само: раз в день проверяет новую версию, обновление ставится по кнопке (выключается в настройках).

            ---

            **Mac** - `Almanac_Notch_*_universal.dmg`: open it and drag the app to Applications. The app is not signed by Apple yet: on first launch macOS says it can't verify the developer. Open System Settings → Privacy & Security and press "Open Anyway" (once).

            **Windows** - `Almanac.Notch.Setup.exe`: pick any folder, no admin rights needed. Not signed yet: SmartScreen asks - "More info" → "Run anyway". The `*_x64-setup.exe` file is for the app's own updates, no need to download it.

            After that the app keeps itself up to date: it checks once a day, the update installs on a click (can be turned off in settings).

      # Windows (stage 8g): our installer window around the NSIS installer tauri-action just built;
      # the NSIS file stays in the release for the updater (latest.json points to it)
      - name: Setup.exe
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node apps/desktop/scripts/setup-exe.mjs "$RUNNER_TEMP/Almanac.Notch.Setup.exe"
          gh release upload "${{ github.ref_name }}" "$RUNNER_TEMP/Almanac.Notch.Setup.exe" --clobber
